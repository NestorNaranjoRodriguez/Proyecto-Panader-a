<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="../CSS/form.css">
    <link rel="icon" type="image/png" href="../Images/Cabecera.jpg">
</head>
<body>
    <div class="wrapper">
        <div class="card-switch">
            <label class="switch">
               <input class="toggle" type="checkbox">
               <span class="slider"></span>
               <span class="card-side"></span>
               <div class="flip-card__inner">
                  <div class="flip-card__front">
                     <div class="title">Iniciar Sesion</div>
                     <form action="" class="flip-card__form">
                        <input type="email" placeholder="Email" name="email" class="flip-card__input">
                        <input type="password" placeholder="Password" name="password" class="flip-card__input">
                        <button class="flip-card__btn">Acceder</button>
                        <button type="button" onclick="window.history.back();" class="back-btn">Volver</button>
                     </form>
                  </div>
                  <div class="flip-card__back">
                     <div class="title">Registrarse</div>
                     <form action="" class="flip-card__form">
                        <input type="name" placeholder="Name" class="flip-card__input">
                        <input type="email" placeholder="Email" name="email" class="flip-card__input">
                        <input type="password" placeholder="Password" name="password" class="flip-card__input">
                        <button class="flip-card__btn">Crear</button>
                        <button type="button" onclick="window.history.back();" class="back-btn">Volver</button>
                     </form>
                  </div>
               </div>
            </label>
        </div>   
    </div>
</body>
</html>
